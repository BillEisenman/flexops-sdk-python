name: SDK tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Python SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install '.[dev]' build
      - run: pytest -q
      - run: ruff check src tests
      - run: python -m build
